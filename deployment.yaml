apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipkart-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flipkart
  template:
    metadata:
      labels:
        app: flipkart
    spec:
      containers:
        - name: flipkart-container
          image: anishaflipkart27/flipkart_shopping_app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6080